apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitly-backend
  namespace: orbitly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitly-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
