apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitly-frontend
  namespace: orbitly
  labels:
    app.kubernetes.io/name: orbitly-frontend
    app.kubernetes.io/part-of: orbitly
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orbitly-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitly-frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          # Built by orbitly-frontend/.github/workflows/deploy.yml
          image: ghcr.io/atharva7775/orbitly-frontend:1.1.1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /catalog
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
