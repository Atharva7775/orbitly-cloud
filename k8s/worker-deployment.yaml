apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitly-worker
  namespace: orbitly
  labels:
    app.kubernetes.io/name: orbitly-worker
    app.kubernetes.io/part-of: orbitly
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orbitly-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitly-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          # Same image as the API; consumes order.placed and user.signed_up.
          image: ghcr.io/atharva7775/orbitly-backend:1.1.1
          command: ["python", "-m", "app.workers.runner"]
          envFrom:
            - configMapRef:
                name: orbitly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbitly-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
