apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitly-backend
  namespace: orbitly
  labels:
    app.kubernetes.io/name: orbitly-backend
    app.kubernetes.io/part-of: orbitly
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orbitly-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitly-backend
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Applies orbitly-backend/migrations/*.sql before the API starts.
        - name: migrate
          image: ghcr.io/atharva7775/orbitly-backend:1.1.0
          command: ["python", "-m", "app.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbitly-db
                  key: DATABASE_URL
      containers:
        - name: backend
          # Built by orbitly-backend/.github/workflows/deploy.yml
          image: ghcr.io/atharva7775/orbitly-backend:1.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orbitly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbitly-db
                  key: DATABASE_URL
            - name: PAYMENTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orbitly-payments
                  key: PAYMENTS_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
